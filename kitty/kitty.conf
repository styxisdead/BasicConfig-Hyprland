include matugen-colors.conf

# =========================
# PINK / PASTEL KITTY THEME
# =========================

font_family MesloLGLDZ Nerd Font
font_size 11

# Deep plum instead of pure black
# background #18121c
# foreground #f7d6e8

Slight transparency
background_opacity 0.82

# Cursor
# cursor #ff8fc8
# cursor_text_color #18121c

# Selection
# selection_background #d96aa8
# selection_foreground #ffffff

# =========================
# PINK / PURPLE ANSI COLORS
# =========================

# Black
color0 #241a29
# color8 #6f5268

# Red / pink
# color1 #e85d9e
# color9 #ff82bd

# Green / pastel green
# color2 #8fd6b0
# color10 #b3f0ce

# Yellow / pastel gold
# color3 #e8c77b
# color11 #f7dfa3

# Blue / lavender
# color4 #9e8de8
# color12 #bcaeff

# Magenta / pink
# color5 #c77dba
# color13 #e5a6d5

# Cyan / pastel cyan
# color6 #83cbd1
# color14 #a9e9ed

# White / pastel white
# color7 #e8dce4
color15 #fff3fa

# =========================
# WINDOW APPEARANCE
# =========================

window_padding_width 10
hide_window_decorations yes

# Rounded corners are handled by Hyprland
confirm_os_window_close 0
